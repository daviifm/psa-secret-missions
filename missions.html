<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission</title>
    <link rel="stylesheet" href="css/missions.css">
</head>
<body>
    <a id="back-button" href="index.html"></a>
    <div id="game-container"></div>
    <script>
        const params = new URLSearchParams(window.location.search)
        const folder = params.get("folder")
        const quest = params.get("quest")
    </script>

    <script>
        if('serviceWorker' in navigator) {
            navigator.serviceWorker.register(`./sw.js?folder=${encodeURIComponent(folder)}&quest=${quest}`)
                .then(registration => {
                    const sendMessage = (sw) => {
                        sw.postMessage({folder, quest})
                        loadGame()
                    }
                    if(registration.active) {
                        sendMessage(registration.active)
                    } else if(registration.installing) {
                        registration.installing.addEventListener('statechange', function() {
                            if(this.state === 'activated') {
                                sendMessage(registration.active)
                            }
                        })
                    }
                })
        }
        function loadGame() {
            const ruffleScript = document.createElement('script')
            ruffleScript.src = 'ruffle/ruffle.js'
            document.body.appendChild(ruffleScript)
            ruffleScript.onload = () => {
                const embed = document.createElement('embed')
                embed.setAttribute('src', `swf/${folder}/quest/${quest}/quest.swf`)
                embed.setAttribute('width', '100%')
                embed.setAttribute('height', '100%')
                const object = document.createElement('object')
                object.appendChild(embed)
                document.getElementById('game-container').appendChild(object)
            }
        }
    </script>
    <footer>
        <p>Made by <a href="https://github.com/daviifm" target="_blank">daviifm</a> · Not affiliated with Disney or Club Penguin · For preservation purposes only</p>
    </footer>
</body>
</html>
